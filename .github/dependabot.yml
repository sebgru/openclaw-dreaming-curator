version: 2

updates:
  # Runtime/dev npm dependencies. Grouped so routine bumps arrive as a single
  # reviewable pull request instead of one PR per package.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Keep the CI/release workflow actions pinned and up to date.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
